<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Café Menu</title>
	<style>
		* {
			box-sizing: border-box;
		}

		:root {
			color: #181716;
			font-family: Arial, Helvetica, sans-serif;
			background: #f4f1ee;
		}

		body {
			margin: 0;
		}

		button,
		input {
			font: inherit;
		}

		button {
			cursor: pointer;
		}

		.app {
			width: min(100%, 480px);
			min-height: 100vh;
			margin: auto;
			background: #fff;
			box-shadow: 0 0 35px #2f201012;
			padding-bottom: 80px;
		}

		.hero {
			height: 245px;
			overflow: hidden;
			background: #6e402c;
		}

		.hero svg {
			width: 100%;
			height: 100%;
			display: block;
			object-fit: cover;
		}

		main {
			padding: 28px 24px 0;
		}

		h1 {
			margin: 0 0 24px;
			font-size: 30px;
			letter-spacing: -1.1px;
		}

		.search {
			display: flex;
			align-items: center;
			gap: 12px;
			width: 100%;
			max-width: 270px;
			height: 54px;
			padding: 0 17px;
			border: 1px solid #e6e3e0;
			border-radius: 30px;
			color: #888;
		}

		.search svg {
			flex: none;
			width: 18px;
			height: 18px;
		}

		.search input {
			min-width: 0;
			width: 100%;
			border: 0;
			outline: 0;
			color: #222;
			font-size: 13px;
		}

		.search input::placeholder {
			color: #999;
		}

		.filters {
			display: flex;
			gap: 7px;
			margin: 18px 0 14px;
			overflow-x: auto;
			scrollbar-width: none;
		}

		.filters::-webkit-scrollbar {
			display: none;
		}

		.filter {
			flex: none;
			border: 0;
			border-radius: 22px;
			padding: 12px 14px;
			background: #f5f4f2;
			color: #777;
			font-size: 11px;
		}

		.filter.active {
			color: white;
			background: #191918;
		}

		.item {
			display: grid;
			grid-template-columns: 84px minmax(0, 1fr) 42px;
			gap: 16px;
			align-items: center;
			min-height: 116px;
			border-bottom: 1px solid #ebe8e5;
		}

		.item-image {
			width: 84px;
			height: 84px;
			border-radius: 9px;
			overflow: hidden;
			background: #a67556;
		}

		.item-image svg {
			width: 100%;
			height: 100%;
			display: block;
		}

		.item h2 {
			margin: 0 0 7px;
			font-size: 15px;
			letter-spacing: -.2px;
		}

		.price {
			margin: 0 0 8px;
			font-size: 13px;
		}

		.description {
			margin: 0;
			color: #77716d;
			font-family: Georgia, serif;
			font-size: 10px;
			line-height: 1.35;
		}

		.add {
			width: 42px;
			height: 42px;
			border: 0;
			border-radius: 50%;
			background: #824018;
			color: white;
			font-size: 25px;
			font-weight: 300;
			line-height: 1;
		}

		.add:active {
			transform: scale(.94);
		}

		.empty {
			padding: 35px 0;
			color: #777;
			font-size: 14px;
		}

		.nav {
			position: fixed;
			z-index: 2;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			width: min(100%, 480px);
			height: 80px;
			background: #fff;
			border-top: 1px solid #eae7e4;
		}

		.nav button {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 6px;
			padding: 0;
			border: 0;
			background: transparent;
			color: #777;
			font-size: 10px;
		}

		.nav button.active {
			color: #171717;
			font-weight: bold;
		}

		.nav svg {
			width: 22px;
			height: 22px;
			fill: none;
			stroke: currentColor;
			stroke-width: 1.4;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.cart-count {
			display: none;
			position: absolute;
			margin: -32px 0 0 24px;
			padding: 2px 5px;
			border-radius: 10px;
			background: #824018;
			color: white;
			font-size: 9px;
		}

		.cart-count.visible {
			display: block;
		}

		@media (max-width: 350px) {
			.hero {
				height: 40vw;
				min-height: 150px;
			}

			main {
				padding: 22px 20px 0;
			}

			h1 {
				font-size: 27px;
			}

			.item {
				grid-template-columns: 72px minmax(0, 1fr) 38px;
				gap: 12px;
				min-height: 105px;
			}

			.item-image {
				width: 72px;
				height: 72px;
			}

			.add {
				width: 38px;
				height: 38px;
			}
		}
	</style>
</head>

<body>

				<use href="#latte" />

	</div>
	<script>
		const env={API_URL: document.location.hostname =="localhost" ? `http://localhost:8788` : 'https://cafe.uitumen-7dc.workers.dev'}
		fetch(`${env.API_URL}/api/products`)
			.then(response => response.json())
			.then(products => {
				const itemsContainer = document.querySelector('.items');
				itemsContainer.insertAdjacentHTML('beforeend', 
				products.reduce((acc, product) => {
					const articleHTML = `<article class="item" data-category="${product.category}" data-name="${product.name.toLowerCase()}">
											<div class="item-image"><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#${product.name.toLowerCase().replace(/\s+/g, '-')}" /></svg></div>
											<div>
												<h2>${product.name}</h2>
												<p class="price">${product.price}</p>
												<p class="description">${product.description}</p>
											</div>
											<button class="add" aria-label="Add ${product.name} to order">+</button>
										</article>`;
					return acc + articleHTML;
				}, ''));

			});
	</script>
